name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: omacom/omarchy
          ref: 8f324c90b82790d31ab33565441e07cbdb8d2308
          path: omarchy
          sparse-checkout: |
            bin/omarchy-plugin-validate
            shell/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Install Qt 6 QML lint
        run: python -m pip install --disable-pip-version-check --no-cache-dir PySide6-Essentials==6.11.2
      - name: Check official plugin layout
        run: ./omarchy/bin/omarchy-plugin-validate ./plugin
      - name: Validate release metadata
        run: bash ./plugin/scripts/check-release-metadata.sh
      - name: Lint QML
        env:
          OMARCHY_SHELL_PATH: ${{ github.workspace }}/omarchy/shell
        run: bash ./plugin/scripts/lint-qml.sh
      - name: Test service behavior
        working-directory: plugin
        run: node --test service.test.cjs
      - name: Check shell syntax and whitespace
        run: |
          bash -n plugin/scripts/check-release-metadata.sh plugin/scripts/lint-qml.sh
          git -C plugin diff --check
