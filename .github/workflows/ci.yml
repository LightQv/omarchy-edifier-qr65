name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Parse QML
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qt6-declarative-dev-tools
          for file in BarWidget.qml Panel.qml Qr65Icon.qml Service.qml; do
            /usr/lib/qt6/bin/qmlformat "$file" >/dev/null
          done
      - name: Test service behavior
        run: node --test service.test.cjs
      - name: Check official plugin layout
        env:
          OMARCHY_COMMIT: 5b91db503c904bbfc5f34bdaaa9c708814958f3d
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/omacom/omarchy.git /tmp/omarchy
          git -C /tmp/omarchy checkout --detach "$OMARCHY_COMMIT"
          PATH="/tmp/omarchy/bin:$PATH" omarchy-plugin-validate .
